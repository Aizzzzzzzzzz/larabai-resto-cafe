<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>System Navigator · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Screens: index.html -->
<body data-module="index">
<template data-view="index" data-default data-title="System Navigator · Brew &amp; Bite Café" data-body-class="">
<header class="topbar">
  <div class="container">
    <a class="brand" href="index.html">
      <span class="brand-mark">B&amp;B</span>
      <span class="brand-name">Brew &amp; Bite Café</span>
    </a>
    <div class="topbar-right">
      <span class="tag">Demo navigator</span>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </div>
</header>

<main class="container">
  <section class="hero">
    <div>
      <div class="eyebrow">Case study · Tarlac City</div>
      <h1>Brew &amp; Bite Café ordering system</h1>
      <p class="lead">Every screen of the QR ordering, kitchen and inventory system in one place. Use it to run the demo; customers never see this page.</p>
      <div class="live" id="live" aria-live="polite"></div>
    </div>

    <aside class="walk" aria-labelledby="walkTitle">
      <h2 id="walkTitle">Suggested walkthrough</h2>
      <p>Follow one order from the table to the sales report. Open each step in a new tab.</p>
      <ol id="walk"></ol>
    </aside>
  </section>

  <section class="section" aria-labelledby="tablesTitle">
    <div class="section-head">
      <div>
        <h2 id="tablesTitle">Scan a table</h2>
        <p>Every table has a QR standee in the middle. Opening a table is the same as a customer scanning it; take-out and delivery start from the counter QR.</p>
      </div>
    </div>
    <div class="tables" id="tables"></div>
  </section>

  <section class="section" aria-labelledby="rolesTitle">
    <div class="section-head">
      <div>
        <h2 id="rolesTitle">Screens by role</h2>
        <p>Staff screens ask for a login first. The demo accounts are shown on each card.</p>
      </div>
    </div>
    <div class="roles" id="roles"></div>
  </section>
</main>

<footer>
  <div class="container">
    <span>Brew &amp; Bite Café is a fictional business for a case study. Orders and payments are stored only in this browser.</span>
    <span class="reset">
      <span id="resetMsg" role="status"></span>
      <button class="btn btn-ghost" id="resetDemo" type="button">Reset demo data</button>
    </span>
  </div>
</footer>
</template>

<script src="js/app.js"></script>
</body>
</html>
