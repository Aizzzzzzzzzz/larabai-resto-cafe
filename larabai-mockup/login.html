<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Staff login · Brew &amp; Bite Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<!-- Screens: login.html -->
<body data-module="login" class="m-staff">
<template data-view="login" data-default data-title="Staff login · Brew &amp; Bite Café" data-body-class="">
<div class="login">
  <aside class="board" aria-label="Today at the café">
    <div class="board-top">
      <a class="brand" href="index.html"><span class="brand-mark">B&amp;B</span><span class="brand-name">Brew &amp; Bite Café</span></a>
      <button class="theme-toggle" type="button" data-theme-toggle aria-pressed="false" aria-label="Switch to dark mode">
        <svg class="i-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/></svg>
        <svg class="i-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>

    <div class="board-main">
      <div>
        <div class="eyebrow" id="today"></div>
        <h1 id="greet">Good shift ahead.</h1>
        <p class="board-lead">Here’s what is waiting right now. Log in to open your screen.</p>
      </div>
      <div class="shift" id="shift" aria-live="polite"></div>
    </div>

    <div class="board-foot"><span>Staff only</span><span>Every login is recorded in the audit log</span></div>
  </aside>

  <main class="side-form">
    <div class="login-card">
      <div class="context" id="context" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
        <span id="contextText"></span>
      </div>

      <h2>Log in</h2>
      <p>Use your staff username and password.</p>

      <div class="signed-in" id="signedIn" hidden></div>

      <form id="form" novalidate style="display:grid;gap:16px">
        <div class="err" id="err" role="alert" hidden>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 16.5v.5"/></svg>
          <span id="errText"></span>
        </div>
        <div class="field">
          <label for="username">Username</label>
          <input class="input" id="username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <div class="pw">
            <input class="input" id="password" type="password" autocomplete="current-password" required>
            <button type="button" id="showPw" aria-controls="password" aria-pressed="false">Show</button>
          </div>
        </div>
        <button class="btn btn-primary submit" type="submit" id="submit">Log in</button>
      </form>

      <section class="demo" aria-labelledby="demoTitle">
        <div class="demo-head"><h3 id="demoTitle">Demo accounts</h3><span>Pick one to fill the form</span></div>
        <div class="accts" id="accts"></div>
      </section>
    </div>
  </main>
</div>
</template>

<script src="js/app.js"></script>
</body>
</html>
